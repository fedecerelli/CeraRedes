<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0A227A">
  <title>Cerámica · Creador de Contenido</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    /* ==========================================================================
       1. VARIABLES Y RESET (MOBILE FIRST)
       ========================================================================== */
    :root {
      --blue-main: #0A227A;
      --blue-dark: #0B132B;
      --blue-electric: #2E86AB;
      --bg-app: #121212;
      --bg-surface: #1E1E1E;
      --bg-sheet: #252525;
      --text-main: #FFFFFF;
      --text-muted: #A0A0A0;
      --border-color: #333333;
      --safe-bottom: env(safe-area-inset-bottom, 20px);
      --ui-radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    body {
      font-family: 'Montserrat', sans-serif;
      background: var(--bg-app);
      color: var(--text-main);
      overflow: hidden; /* App is a fixed viewport */
      width: 100vw;
      height: 100dvh;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ==========================================================================
       2. ESTRUCTURA DE LA APLICACIÓN Y NAVEGACIÓN
       ========================================================================== */
    .app-view {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      display: flex; flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      background: var(--bg-app);
      z-index: 10;
    }
    .app-view.active { transform: translateX(0); z-index: 20; }
    .app-view.home { transform: translateX(0); } /* Home is always base */

    .top-bar {
      height: 60px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px; background: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      padding-top: env(safe-area-inset-top, 0px);
      box-sizing: content-box;
    }
    .top-bar-title { font-weight: 800; font-size: 16px; letter-spacing: -0.02em; }
    
    .icon-btn {
      width: 44px; height: 44px;
      display: flex; align-items: center; justify-content: center;
      background: transparent; border: none; color: var(--text-main);
      border-radius: 50%; cursor: pointer;
    }
    .icon-btn:active { background: rgba(255,255,255,0.1); }
    .icon-btn svg { width: 24px; height: 24px; fill: currentColor; }

    .btn-primary {
      background: var(--blue-main); color: #fff;
      border: none; padding: 12px 24px; border-radius: 24px;
      font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 8px;
    }
    .btn-primary:active { transform: scale(0.96); }

    /* ==========================================================================
       3. PANTALLA INICIO (HOME)
       ========================================================================== */
    .home-content {
      flex: 1; overflow-y: auto; padding: 20px 16px 100px;
    }
    .category-title {
      font-size: 12px; font-weight: 800; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.1em; margin: 24px 0 12px;
    }
    .template-grid {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;
    }
    .template-card {
      background: var(--bg-surface); border: 1px solid var(--border-color);
      border-radius: var(--ui-radius); padding: 16px;
      display: flex; flex-direction: column; align-items: center; gap: 12px;
    }
    .template-card:active { background: var(--border-color); }
    .template-card svg { width: 40px; height: 40px; color: var(--blue-electric); }
    .template-card span { font-size: 13px; font-weight: 700; text-align: center; }

    /* ==========================================================================
       4. PANTALLA EDITOR Y CANVAS
       ========================================================================== */
    .editor-workspace {
      flex: 1; position: relative; background: #000; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }
    .canvas-container {
      position: absolute; transform-origin: center center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }
    
    /* Área táctil de herramientas inferiores */
    .bottom-toolbar {
      height: 70px; background: var(--bg-surface);
      display: flex; align-items: center; justify-content: space-around;
      padding-bottom: var(--safe-bottom); box-sizing: content-box;
      border-top: 1px solid var(--border-color);
    }
    .tool-btn {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      background: transparent; border: none; color: var(--text-muted);
      font-size: 10px; font-weight: 600; padding: 8px; min-width: 60px;
    }
    .tool-btn svg { width: 22px; height: 22px; }
    .tool-btn.active { color: var(--blue-electric); }

    /* ==========================================================================
       5. BOTTOM SHEETS (MENÚS CONTEXTUALES TIPO CANVA)
       ========================================================================== */
    .bottom-sheet {
      position: absolute; bottom: 0; left: 0; width: 100%;
      background: var(--bg-sheet); border-top-left-radius: 24px; border-top-right-radius: 24px;
      transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
      z-index: 100; box-shadow: 0 -10px 40px rgba(0,0,0,0.5);
      display: flex; flex-direction: column; max-height: 80vh;
    }
    .bottom-sheet.active { transform: translateY(0); }
    .sheet-header {
      padding: 16px; display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
    }
    .sheet-title { font-weight: 800; font-size: 15px; }
    .sheet-content { padding: 16px; overflow-y: auto; padding-bottom: calc(16px + var(--safe-bottom)); }
    
    .input-group { margin-bottom: 16px; }
    .input-group label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 6px; font-weight: 700; text-transform: uppercase; }
    .input-control {
      width: 100%; background: var(--bg-surface); border: 1px solid var(--border-color);
      color: #fff; padding: 14px; border-radius: 12px; font-family: inherit; font-size: 14px;
    }
    .input-control:focus { outline: none; border-color: var(--blue-electric); }
    
    .format-switcher { display: flex; background: var(--bg-surface); border-radius: 12px; padding: 4px; }
    .format-btn {
      flex: 1; padding: 10px; text-align: center; border: none; background: transparent;
      color: var(--text-muted); font-weight: 700; font-size: 12px; border-radius: 8px;
    }
    .format-btn.active { background: var(--blue-main); color: #fff; }

    .file-upload-btn {
      display: block; width: 100%; background: var(--bg-surface); border: 1px dashed var(--blue-electric);
      color: var(--blue-electric); text-align: center; padding: 16px; border-radius: 12px; font-weight: 700; margin-bottom: 16px;
    }

    .scrim {
      position: absolute; inset: 0; background: rgba(0,0,0,0.6); z-index: 90;
      opacity: 0; pointer-events: none; transition: opacity 0.3s;
    }
    .scrim.active { opacity: 1; pointer-events: auto; }

    /* ==========================================================================
       6. DISEÑO VISUAL DE LOS FLYERS (INMUTABLE - REGLA 9)
       ========================================================================== */
    .card { position: relative; overflow: hidden; background: #0B132B; transform-origin: top left; }
    .card-916 { width: 1080px; height: 1920px; }
    .card-11 { width: 1080px; height: 1080px; }
    
    .flyer-background {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;
      background-size: cover; background-position: center; background-repeat: no-repeat;
      background-color: #0B132B;
    }
    /* Estilos base si NO hay imagen subida */
    .flyer-background.default-bg {
      background-image: 
        radial-gradient(ellipse at 30% 10%, rgba(46, 134, 171, 0.25) 0%, transparent 50%),
        radial-gradient(ellipse at 70% 10%, rgba(46, 134, 171, 0.25) 0%, transparent 50%),
        linear-gradient(180deg, #0B132B 0%, #141E3A 30%, #1A2A6C 100%);
    }
    .flyer-overlay {
      position: absolute; inset: 0; z-index: 2; pointer-events: none;
      background: radial-gradient(ellipse at 50% 50%, transparent 20%, rgba(0,0,0,0.15) 50%, rgba(0,0,0,0.55) 100%);
    }

    .card-content {
      position: relative; width: 100%; height: 100%; display: flex; flex-direction: column;
      justify-content: space-between; padding: 60px; z-index: 4; color: #fff; box-sizing: border-box;
    }
    .card-916 .card-content { padding-top: 150px; } /* Espacio para notch/instagram UI */

    .f-header { display: flex; align-items: center; gap: 24px; margin-bottom: 20px; }
    .f-crest { width: 90px; height: 90px; filter: drop-shadow(0 4px 12px rgba(0,0,0,0.4)); }
    .f-name { font-family: 'Montserrat', sans-serif; font-weight: 800; text-transform: uppercase; line-height: 1.1; }
    .f-name .l1 { font-size: 28px; color: rgba(255,255,255,0.7); }
    .f-name .l2 { font-size: 36px; color: #fff; }

    .f-cat { font-family: 'Bebas Neue', sans-serif; font-size: 44px; letter-spacing: 0.25em; color: var(--blue-electric); }
    .f-title { font-family: 'Bebas Neue', sans-serif; line-height: 0.85; margin-bottom: 20px; }
    .f-title .t1 { font-size: 130px; color: #fff; display: block; letter-spacing: 0.02em; }
    .f-title .t2 { font-size: 180px; color: var(--blue-electric); display: block; }

    /* Partidos / Equipos */
    .f-teams { display: flex; align-items: center; justify-content: center; gap: 40px; margin: 40px 0; }
    .f-team { display: flex; flex-direction: column; align-items: center; flex: 1; }
    .f-team-crest { width: 260px; height: 260px; object-fit: contain; filter: drop-shadow(0 10px 30px rgba(0,0,0,0.5)); }
    .f-team-name { font-family: 'Bebas Neue', sans-serif; font-size: 42px; color: #fff; margin-top: 20px; text-shadow: 0 2px 12px rgba(0,0,0,0.5); text-align: center;}
    .f-vs { font-family: 'Bebas Neue', sans-serif; font-size: 80px; color: var(--blue-electric); }

    .f-info { display: flex; justify-content: center; gap: 40px; border-top: 2px solid rgba(255,255,255,0.15); border-bottom: 2px solid rgba(255,255,255,0.15); padding: 30px 0; }
    .f-info-item { text-align: center; }
    .f-info-day { font-size: 20px; font-weight: 700; color: rgba(255,255,255,0.7); text-transform: uppercase; letter-spacing: 0.1em; }
    .f-info-val { font-size: 60px; font-family: 'Bebas Neue', sans-serif; color: #fff; line-height: 1; }
    .f-info-div { width: 2px; background: rgba(255,255,255,0.2); }

    .f-footer { text-align: center; font-size: 24px; font-weight: 700; color: rgba(255,255,255,0.6); text-transform: uppercase; margin-top: auto; }
    .f-footer .c2 { color: var(--blue-electric); }

    /* Plantillas Nuevas - Estilos coherentes */
    /* Jugador / Genérico libre image handler */
    .f-hero-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; opacity: 0.9; }
    .f-player-info { position: relative; z-index: 5; background: linear-gradient(transparent, #0B132B 80%); padding: 40px; margin-top: auto; }
    .f-player-name { font-family: 'Bebas Neue', sans-serif; font-size: 140px; line-height: 0.8; text-shadow: 0 10px 20px rgba(0,0,0,0.8); }
    .f-player-num { font-family: 'Bebas Neue', sans-serif; font-size: 60px; color: var(--blue-electric); }
    
    /* Listas y Fixture */
    .f-list-container { display: flex; flex-direction: column; gap: 16px; margin: 40px 0; position: relative; z-index: 5;}
    .f-list-row { display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.1); padding: 20px 30px; border-radius: 16px; backdrop-filter: blur(8px); }
    .f-list-text { font-family: 'Bebas Neue', sans-serif; font-size: 40px; letter-spacing: 0.05em; }
    .f-list-sub { font-size: 24px; font-weight: 700; color: var(--blue-electric); }

    /* Elementos interactivos en el canvas */
    .editable-text { cursor: pointer; border: 2px dashed transparent; transition: border 0.2s; }
    .editable-text.active-edit { border-color: rgba(255,255,255,0.5); }
    
  </style>
</head>
<body>

  <!-- =========================================================
       SVGs (No Emojis)
       ========================================================= -->
  <svg style="display:none;">
    <defs>
      <symbol id="ic-back" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></symbol>
      <symbol id="ic-export" viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></symbol>
      <symbol id="ic-text" viewBox="0 0 24 24"><path d="M2.5 4v3h5v12h3V7h5V4h-13zm19 5h-9v3h3v7h3v-7h3V9z"/></symbol>
      <symbol id="ic-image" viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></symbol>
      <symbol id="ic-format" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14z"/></symbol>
      <symbol id="ic-layers" viewBox="0 0 24 24"><path d="M11.99 18.54l-7.37-5.73L3 14.07l9 7 9-7-1.63-1.27-7.38 5.74zM12 16l7.36-5.73L21 9l-9-7-9 7 1.63 1.27L12 16z"/></symbol>
      <symbol id="ic-close" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></symbol>
      <symbol id="ic-download" viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></symbol>
    </defs>
  </svg>

  <!-- =========================================================
       APP VIEW: HOME
       ========================================================= -->
  <div id="view-home" class="app-view home active">
    <div class="top-bar">
      <div class="top-bar-title">CERÁMICA ARGENTINA</div>
    </div>
    <div class="home-content">
      
      <div class="category-title">Partidos</div>
      <div class="template-grid">
        <div class="template-card" onclick="App.openEditor('partido')">
          <svg><use href="#ic-image"></use></svg>
          <span>Próximo Partido</span>
        </div>
        <div class="template-card" onclick="App.openEditor('resultado')">
          <svg><use href="#ic-image"></use></svg>
          <span>Resultado</span>
        </div>
      </div>

      <div class="category-title">Equipo</div>
      <div class="template-grid">
        <div class="template-card" onclick="App.openEditor('jugador')">
          <svg><use href="#ic-image"></use></svg>
          <span>Jugador del Partido</span>
        </div>
        <div class="template-card" onclick="App.openEditor('titular')">
          <svg><use href="#ic-text"></use></svg>
          <span>Equipo Titular</span>
        </div>
        <div class="template-card" onclick="App.openEditor('concentrados')">
          <svg><use href="#ic-text"></use></svg>
          <span>Lista Concentrados</span>
        </div>
      </div>

      <div class="category-title">Competencia</div>
      <div class="template-grid">
        <div class="template-card" onclick="App.openEditor('fixture')">
          <svg><use href="#ic-format"></use></svg>
          <span>Fixture</span>
        </div>
        <div class="template-card" onclick="App.openEditor('calendario')">
          <svg><use href="#ic-format"></use></svg>
          <span>Calendario</span>
        </div>
      </div>

      <div class="category-title">Comunicación Libre</div>
      <div class="template-grid">
        <div class="template-card" onclick="App.openEditor('generico')">
          <svg><use href="#ic-layers"></use></svg>
          <span>Genérico / Libre</span>
        </div>
        <div class="template-card" onclick="App.openEditor('foto')">
          <svg><use href="#ic-image"></use></svg>
          <span>Foto Libre</span>
        </div>
      </div>

    </div>
  </div>

  <!-- =========================================================
       APP VIEW: EDITOR
       ========================================================= -->
  <div id="view-editor" class="app-view">
    <div class="top-bar">
      <button class="icon-btn" onclick="App.closeEditor()">
        <svg><use href="#ic-back"></use></svg>
      </button>
      <div class="format-switcher">
        <button class="format-btn active" onclick="App.setFormat('9:16')">9:16</button>
        <button class="format-btn" onclick="App.setFormat('1:1')">1:1</button>
      </div>
      <button class="icon-btn" style="color: var(--blue-electric);" onclick="App.openExportSheet()">
        <svg><use href="#ic-export"></use></svg>
      </button>
    </div>

    <!-- CANVAS TÁCTIL -->
    <div class="editor-workspace" id="workspace">
      <div class="canvas-container" id="canvas-container">
        <!-- El flyer se inyecta aquí -->
        <div id="flyer-stage"></div>
      </div>
    </div>

    <!-- BARRA INFERIOR (Contextual Tools) -->
    <div class="bottom-toolbar">
      <button class="tool-btn" onclick="App.openSheet('text')">
        <svg><use href="#ic-text"></use></svg>
        <span>Textos</span>
      </button>
      <button class="tool-btn" onclick="App.openSheet('bg')">
        <svg><use href="#ic-image"></use></svg>
        <span>Fondo</span>
      </button>
      <button class="tool-btn" onclick="App.openSheet('elements')">
        <svg><use href="#ic-layers"></use></svg>
        <span>Datos</span>
      </button>
    </div>
  </div>

  <!-- =========================================================
       BOTTOM SHEETS (Paneles de Edición)
       ========================================================= -->
  <div class="scrim" id="scrim" onclick="App.closeSheets()"></div>

  <!-- Sheet: Textos -->
  <div class="bottom-sheet" id="sheet-text">
    <div class="sheet-header">
      <span class="sheet-title">Editar Textos</span>
      <button class="icon-btn" onclick="App.closeSheets()"><svg><use href="#ic-close"></use></svg></button>
    </div>
    <div class="sheet-content" id="sheet-text-content">
      <!-- Se llena dinámicamente según la plantilla -->
    </div>
  </div>

  <!-- Sheet: Fondo (CORRECCIÓN DE BUG CRÍTICO AQUÍ) -->
  <div class="bottom-sheet" id="sheet-bg">
    <div class="sheet-header">
      <span class="sheet-title">Imagen de Fondo</span>
      <button class="icon-btn" onclick="App.closeSheets()"><svg><use href="#ic-close"></use></svg></button>
    </div>
    <div class="sheet-content">
      <label class="file-upload-btn">
        Seleccionar Imagen
        <input type="file" id="bg-upload" accept="image/*" style="display:none;" onchange="App.handleBackgroundUpload(event)">
      </label>
      <button class="btn-primary" style="width:100%; justify-content:center;" onclick="App.clearBackground()">Quitar Imagen</button>
    </div>
  </div>

  <!-- Sheet: Exportar -->
  <div class="bottom-sheet" id="sheet-export">
    <div class="sheet-header">
      <span class="sheet-title">Exportar Flyer</span>
      <button class="icon-btn" onclick="App.closeSheets()"><svg><use href="#ic-close"></use></svg></button>
    </div>
    <div class="sheet-content">
      <button class="btn-primary" style="width:100%; justify-content:center; margin-bottom:12px; font-size:16px;" onclick="App.exportFlyer('png')">
        <svg style="width:24px; height:24px; fill:currentColor;"><use href="#ic-download"></use></svg> Exportar Alta Calidad (PNG)
      </button>
      <button class="file-upload-btn" style="border-color:var(--border-color); color:var(--text-main);" onclick="App.exportFlyer('jpeg')">
        Exportar Rápido (JPG)
      </button>
      <p style="text-align:center; font-size:11px; color:var(--text-muted); margin-top:8px;">La exportación es idéntica a la vista previa.</p>
    </div>
  </div>

  <!-- =========================================================
       LÓGICA JAVASCRIPT (ARQUITECTURA MODULAR)
       ========================================================= -->
  <script>
    /**
     * STATE MANAGEMENT
     */
    const State = {
      template: null,
      format: '9:16',
      texts: {},
      background: null // Base64 o URL. null = default background
    };

    /**
     * TEMPLATES DEFINITION (HTML GENERATORS)
     * Regla 9 y 11: Mantener diseño visual exacto.
     */
    const Templates = {
      generico: () => `
        <div class="card card-${State.format.replace(':','')}">
          <!-- UNICA FUENTE DE VERDAD PARA EL FONDO (Regla 6) -->
          <div class="flyer-background ${!State.background ? 'default-bg' : ''}" style="${State.background ? `background-image: url(${State.background});` : ''}"></div>
          <div class="flyer-overlay"></div>
          
          <div class="card-content" style="justify-content: center; align-items: center; text-align:center;">
            <div class="f-header" style="margin-bottom: 60px;">
              <div class="f-crest">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/ca/Escudo_del_Club_Social_y_Deportivo_Cer%C3%A1mica_Argentina.svg/1200px-Escudo_del_Club_Social_y_Deportivo_Cer%C3%A1mica_Argentina.svg.png" style="width:100%">
              </div>
            </div>
            
            <div class="editable-text f-title" data-key="title" style="margin-bottom:40px;">
              <span class="t1" style="font-size:160px; line-height:0.9;">${State.texts.title || 'COMUNICADO'}</span>
            </div>
            
            <div class="editable-text f-name l2" data-key="subtitle" style="font-size:40px; max-width:800px; line-height:1.3;">
              ${State.texts.subtitle || 'Toca aquí para editar este texto libre y agregar la información que necesites comunicar.'}
            </div>
          </div>
        </div>
      `,
      partido: () => `
        <div class="card card-${State.format.replace(':','')}">
          <div class="flyer-background ${!State.background ? 'default-bg' : ''}" style="${State.background ? `background-image: url(${State.background});` : ''}"></div>
          <div class="flyer-overlay"></div>
          
          <div class="card-content">
            <div>
              <div class="f-header">
                <div class="f-crest"><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/ca/Escudo_del_Club_Social_y_Deportivo_Cer%C3%A1mica_Argentina.svg/1200px-Escudo_del_Club_Social_y_Deportivo_Cer%C3%A1mica_Argentina.svg.png" style="width:100%"></div>
                <div class="f-name"><span class="l1">CLUB SOCIAL Y DEPORTIVO</span><br><span class="l2">CERÁMICA ARG.</span></div>
              </div>
              <div class="editable-text f-cat" data-key="category">${State.texts.category || 'PRIMERA DIVISIÓN'}</div>
              <div class="editable-text f-title" data-key="title"><span class="t1">${State.texts.title1 || 'PRÓXIMO'}</span><span class="t2">${State.texts.title2 || 'PARTIDO'}</span></div>
            </div>

            <div class="f-teams">
              <div class="f-team">
                <div class="f-team-crest"><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/ca/Escudo_del_Club_Social_y_Deportivo_Cer%C3%A1mica_Argentina.svg/1200px-Escudo_del_Club_Social_y_Deportivo_Cer%C3%A1mica_Argentina.svg.png" style="width:100%"></div>
                <div class="editable-text f-team-name" data-key="team1">${State.texts.team1 || 'CERÁMICA'}</div>
              </div>
              <div class="f-vs">VS</div>
              <div class="f-team">
                <div class="f-team-crest" style="background:rgba(255,255,255,0.1); border-radius:50%; border:2px dashed #fff; display:flex; align-items:center; justify-content:center; color:#fff; font-family:'Bebas Neue'; font-size:40px;">RIVAL</div>
                <div class="editable-text f-team-name" data-key="team2">${State.texts.team2 || 'RIVAL FC'}</div>
              </div>
            </div>

            <div>
              <div class="f-info">
                <div class="f-info-item">
                  <div class="f-info-day">DÍA</div>
                  <div class="editable-text f-info-val" data-key="date">${State.texts.date || 'DOM 12'}</div>
                </div>
                <div class="f-info-div"></div>
                <div class="f-info-item">
                  <div class="f-info-day">HORA</div>
                  <div class="editable-text f-info-val" data-key="time">${State.texts.time || '15:30'}</div>
                </div>
                <div class="f-info-div"></div>
                <div class="f-info-item">
                  <div class="f-info-day">ESTADIO</div>
                  <div class="editable-text f-info-val" style="font-size:40px; margin-top:10px;" data-key="stadium">${State.texts.stadium || 'LOCAL'}</div>
                </div>
              </div>
              <div class="editable-text f-footer" data-key="competition">
                <span class="c1">${State.texts.comp1 || 'TORNEO CLAUSURA 2026'}</span><br>
                <span class="c2">${State.texts.comp2 || 'LIGA CHIVILCOYANA'}</span>
              </div>
            </div>
          </div>
        </div>
      `,
      jugador: () => `
        <div class="card card-${State.format.replace(':','')}">
          <div class="flyer-background default-bg"></div>
          ${State.background ? `<img src="${State.background}" class="f-hero-img" style="object-fit:cover; mix-blend-mode: luminosity;">` : ''}
          <div class="flyer-overlay" style="background: linear-gradient(to top, #0B132B 0%, transparent 60%);"></div>
          
          <div class="card-content" style="padding:0; justify-content:space-between;">
            <div class="f-header" style="padding: 40px; position:relative; z-index:5;">
              <div class="f-crest"><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/ca/Escudo_del_Club_Social_y_Deportivo_Cer%C3%A1mica_Argentina.svg/1200px-Escudo_del_Club_Social_y_Deportivo_Cer%C3%A1mica_Argentina.svg.png" style="width:100%"></div>
              <div class="editable-text f-cat" style="color:#fff;" data-key="category">${State.texts.category || 'JUGADOR DEL PARTIDO'}</div>
            </div>

            <div class="f-player-info">
               <div class="editable-text f-player-num" data-key="number">${State.texts.number || '#10'}</div>
               <div class="editable-text f-player-name" data-key="player">${State.texts.player || 'NOMBRE APELLIDO'}</div>
               <div class="editable-text f-info-day" style="margin-top:20px; color:var(--blue-electric);" data-key="stats">${State.texts.stats || 'EL MÁS DESTACADO DEL ENCUENTRO'}</div>
            </div>
          </div>
        </div>
      `
    };

    /**
     * APP LOGIC & UI CONTROLLER
     */
    const App = {
      scale: 1,
      init() {
        this.bindEvents();
        // Cargar state de localStorage (Regla 18)
        const saved = localStorage.getItem('ceramica_state');
        if (saved) {
           const parsed = JSON.parse(saved);
           if (parsed.template) {
             State.template = parsed.template;
             State.format = parsed.format || '9:16';
             State.texts = parsed.texts || {};
             State.background = parsed.background || null;
             this.openEditor(State.template, true);
           }
        }
      },

      bindEvents() {
        // Touch Engine para Pan/Zoom del workspace
        const ws = document.getElementById('workspace');
        const container = document.getElementById('canvas-container');
        let isPanning = false, startX, startY, pX = 0, pY = 0;

        ws.addEventListener('pointerdown', e => {
          if (e.target.closest('.bottom-toolbar') || e.target.closest('.top-bar')) return;
          isPanning = true; startX = e.clientX - pX; startY = e.clientY - pY;
          ws.setPointerCapture(e.pointerId);
        });
        ws.addEventListener('pointermove', e => {
          if (!isPanning) return;
          pX = e.clientX - startX; pY = e.clientY - startY;
          container.style.transform = `translate(${pX}px, ${pY}px) scale(${this.scale})`;
        });
        ws.addEventListener('pointerup', e => { isPanning = false; ws.releasePointerCapture(e.pointerId); });
      },

      openEditor(templateId, isRestore = false) {
        if (!isRestore) {
          State.template = templateId;
          State.texts = {};
          State.background = null;
          this.saveState();
        }
        
        // Configurar botones formato
        document.querySelectorAll('.format-btn').forEach(b => b.classList.remove('active'));
        document.querySelector(`.format-btn[onclick="App.setFormat('${State.format}')"]`).classList.add('active');

        this.renderFlyer();
        document.getElementById('view-editor').classList.add('active');
        this.centerCanvas();
      },

      closeEditor() {
        document.getElementById('view-editor').classList.remove('active');
      },

      setFormat(fmt) {
        State.format = fmt;
        document.querySelectorAll('.format-btn').forEach(b => b.classList.remove('active'));
        document.querySelector(`.format-btn[onclick="App.setFormat('${fmt}')"]`).classList.add('active');
        this.renderFlyer();
        this.centerCanvas();
        this.saveState();
      },

      renderFlyer() {
        const stage = document.getElementById('flyer-stage');
        if (Templates[State.template]) {
          stage.innerHTML = Templates[State.template]();
        } else {
          // Fallback a genérico si no está implementada la UI
          stage.innerHTML = Templates.generico();
        }
        
        // Habilitar edición de textos tocando
        stage.querySelectorAll('.editable-text').forEach(el => {
          el.addEventListener('click', (e) => {
             e.stopPropagation();
             this.openSheet('text', el.dataset.key);
          });
        });
      },

      centerCanvas() {
        const ws = document.getElementById('workspace');
        const container = document.getElementById('canvas-container');
        
        // Reset transform
        container.style.transform = '';
        
        // Calcular escala para que entre en la pantalla móvil
        const wsRect = ws.getBoundingClientRect();
        const cw = State.format === '9:16' ? 1080 : 1080;
        const ch = State.format === '9:16' ? 1920 : 1080;
        
        // Dejar padding visual (40px)
        const scaleW = (wsRect.width - 80) / cw;
        const scaleH = (wsRect.height - 80) / ch;
        this.scale = Math.min(scaleW, scaleH);
        
        container.style.width = cw + 'px';
        container.style.height = ch + 'px';
        container.style.transform = `translate(0px, 0px) scale(${this.scale})`;
      },

      openSheet(sheetId, focusKey = null) {
        this.closeSheets();
        document.getElementById('scrim').classList.add('active');
        const sheet = document.getElementById('sheet-' + sheetId);
        if(sheet) sheet.classList.add('active');

        if(sheetId === 'text') {
           this.buildTextForm(focusKey);
        }
      },

      closeSheets() {
        document.querySelectorAll('.bottom-sheet').forEach(s => s.classList.remove('active'));
        document.getElementById('scrim').classList.remove('active');
      },

      buildTextForm(focusKey) {
        const container = document.getElementById('sheet-text-content');
        container.innerHTML = '';
        // Buscar todos los data-key en el DOM actual
        const keys = Array.from(document.querySelectorAll('.editable-text')).map(el => el.dataset.key);
        
        // Filtrar únicos
        const uniqueKeys = [...new Set(keys)];
        
        uniqueKeys.forEach(k => {
           const val = State.texts[k] || '';
           const group = document.createElement('div');
           group.className = 'input-group';
           group.innerHTML = `
             <label>${k.replace(/[0-9]/g, ' ')}</label>
             <input type="text" class="input-control" data-sync="${k}" value="${val}" placeholder="Toca para escribir...">
           `;
           container.appendChild(group);

           const input = group.querySelector('input');
           input.addEventListener('input', (e) => {
              State.texts[k] = e.target.value;
              this.renderFlyer(); // Actualización en vivo rápida
              this.saveState();
           });

           if(focusKey === k) {
             setTimeout(() => input.focus(), 300);
           }
        });
      },

      // BUG FIX: Carga de imagen como DOM background unificado
      handleBackgroundUpload(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          State.background = ev.target.result;
          this.renderFlyer();
          this.saveState();
          this.closeSheets();
        };
        reader.readAsDataURL(file);
      },

      clearBackground() {
        State.background = null;
        this.renderFlyer();
        this.saveState();
        this.closeSheets();
      },

      openExportSheet() {
        this.openSheet('export');
      },

      // EXPORTACIÓN OPTIMIZADA (Regla 15 y 16)
      async exportFlyer(formatStr) {
        this.closeSheets();
        const stage = document.querySelector('.card');
        if(!stage) return;
        
        // Prevenir scroll/zoom afecte render
        const origTransform = stage.parentElement.style.transform;
        stage.parentElement.style.transform = 'scale(1)'; 
        
        try {
          const canvas = await html2canvas(stage, {
            scale: formatStr === 'png' ? 2 : 1, // Alta calidad
            useCORS: true,
            backgroundColor: '#0B132B',
            logging: false
          });

          const dataUrl = canvas.toDataURL(`image/${formatStr}`, formatStr === 'jpeg' ? 0.8 : 1.0);
          
          // Restaurar zoom
          stage.parentElement.style.transform = origTransform;

          // Intento de Web Share API
          if (navigator.share) {
            try {
              const res = await fetch(dataUrl);
              const blob = await res.blob();
              const file = new File([blob], `flyer_ceramica.${formatStr}`, { type: `image/${formatStr}` });
              await navigator.share({
                title: 'Flyer Cerámica',
                files: [file]
              });
              return;
            } catch (err) {
              console.log('Share falló, usando descarga directa');
            }
          }

          // Descarga fallback
          const link = document.createElement('a');
          link.download = `flyer_ceramica_${Date.now()}.${formatStr}`;
          link.href = dataUrl;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          
          // Liberar memoria (Regla 17)
          canvas.width = 0; canvas.height = 0;

        } catch (error) {
          alert('Error al exportar. Intente nuevamente.');
          stage.parentElement.style.transform = origTransform;
        }
      },

      saveState() {
        // Regla 18 Persistencia
        localStorage.setItem('ceramica_state', JSON.stringify(State));
      }
    };

    // Inicializar app
    window.addEventListener('DOMContentLoaded', () => App.init());

  </script>
