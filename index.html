<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0A227A">
  <meta name="color-scheme" content="light dark">
  <title>Flyers · Cerámica Argentina</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Oswald:wght@400;600;700&family=Roboto:wght@400;500;700;900&family=Lato:wght@400;700;900&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
  <style>
    /* ================================================================
       VARIABLES — identidad Cerámica
       ================================================================ */
    :root {
      --blue-deep: #0B132B;
      --blue-mid: #141E3A;
      --blue-institutional: #0A227A;
      --blue-electric: #2E86AB;
      --blue-bright: #4AA3C2;
      --white: #FFFFFF;
      --grey-light: rgba(255,255,255,0.15);
      --grey-text: rgba(255,255,255,0.7);
      --ui-bg: #F7F7F9;
      --ui-canvas: #F0F1F4;
      --ui-surface: #FFFFFF;
      --ui-surface-2: #F5F5F7;
      --ui-surface-3: #FAFAFB;
      --ui-border: #E7E7EC;
      --ui-border-strong: #D7D8E1;
      --ui-text: #15161C;
      --ui-text-muted: #6C6E7A;
      --ui-text-soft: #9A9BA8;
      --ui-accent: #0A227A;
      --ui-accent-2: #2E86AB;
      --ui-accent-soft: #EEF1F8;
      --ui-accent-ink: #0A227A;
      --ui-danger: #D6444E;
      --ui-danger-soft: #FBEEEE;
      --ui-success: #1C9C6E;
      --ui-success-soft: #EAF7F1;
      --ui-radius-sm: 10px;
      --ui-radius-md: 14px;
      --ui-radius-lg: 18px;
      --ui-radius-xl: 22px;
      --ui-radius-pill: 999px;
      --ui-shadow-xs: 0 1px 2px rgba(15,16,22,0.04);
      --ui-shadow-sm: 0 1px 3px rgba(15,16,22,0.06);
      --ui-shadow-md: 0 6px 20px -10px rgba(15,16,22,0.14);
      --ui-shadow-lg: 0 16px 40px -18px rgba(15,16,22,0.22);
      --ui-shadow-accent: 0 2px 10px -3px rgba(10,34,122,0.28);
      --ui-font-ui: 'Plus Jakarta Sans','Montserrat',sans-serif;
      --app-bar-h: 60px;
      --bottom-bar-h: 72px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    html[data-theme="dark"] {
      --ui-bg: #101115;
      --ui-canvas: #0B0C0F;
      --ui-surface: #18191E;
      --ui-surface-2: #1E1F25;
      --ui-surface-3: #24252C;
      --ui-border: #2A2B33;
      --ui-border-strong: #383A44;
      --ui-text: #F2F2F5;
      --ui-text-muted: #A4A6B0;
      --ui-text-soft: #6E707C;
      --ui-accent: #6D8EFF;
      --ui-accent-2: #4AA3C2;
      --ui-accent-soft: #1A2036;
      --ui-accent-ink: #C4D2FF;
      --ui-danger: #E8747C;
      --ui-danger-soft: #2A1B1D;
      --ui-success: #3FCB98;
      --ui-success-soft: #10241D;
    }
    @media (prefers-color-scheme: dark) {
      html:not([data-theme="light"]) {
        --ui-bg: #101115;
        --ui-canvas: #0B0C0F;
        --ui-surface: #18191E;
        --ui-surface-2: #1E1F25;
        --ui-surface-3: #24252C;
        --ui-border: #2A2B33;
        --ui-border-strong: #383A44;
        --ui-text: #F2F2F5;
        --ui-text-muted: #A4A6B0;
        --ui-text-soft: #6E707C;
        --ui-accent: #6D8EFF;
        --ui-accent-2: #4AA3C2;
        --ui-accent-soft: #1A2036;
        --ui-accent-ink: #C4D2FF;
        --ui-danger: #E8747C;
        --ui-danger-soft: #2A1B1D;
        --ui-success: #3FCB98;
        --ui-success-soft: #10241D;
      }
    }

    * { box-sizing: border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
    html { -webkit-text-size-adjust:100%; scroll-behavior:smooth; }
    body {
      font-family: var(--ui-font-ui);
      background: var(--ui-bg);
      color: var(--ui-text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      overflow-x:hidden;
      transition: background 0.2s, color 0.2s;
    }
    svg { display:block; }
    button { font-family:inherit; cursor:pointer; border:none; background:none; }

    /* ================================================================
       APP BAR
       ================================================================ */
    .app-bar {
      height: var(--app-bar-h);
      flex-shrink:0;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 16px;
      background:var(--ui-surface);
      border-bottom:1px solid var(--ui-border);
      position:sticky;
      top:0;
      z-index:200;
    }
    .app-bar-brand {
      display:flex;
      align-items:center;
      gap:10px;
    }
    .app-bar-crest {
      width:36px; height:36px;
      border-radius:12px;
      background:linear-gradient(150deg, var(--blue-institutional), var(--blue-electric));
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:800;
      font-size:12px;
    }
    .app-bar-text strong { font-size:15px; font-weight:800; }
    .app-bar-text small { font-size:10px; color:var(--ui-text-muted); display:block; }
    .theme-toggle {
      width:38px; height:38px;
      border-radius:var(--ui-radius-pill);
      border:1px solid var(--ui-border);
      background:var(--ui-surface-2);
      color:var(--ui-text-muted);
      display:flex;
      align-items:center;
      justify-content:center;
      transition:0.15s;
    }
    .theme-toggle:active { transform:scale(0.9); }
    .theme-toggle .ico-moon { display:none; }
    html[data-theme="dark"] .theme-toggle .ico-sun { display:none; }
    html[data-theme="dark"] .theme-toggle .ico-moon { display:block; }

    /* ================================================================
       PANTALLA INICIO (galería)
       ================================================================ */
    #home {
      flex:1;
      padding:16px 16px calc(var(--bottom-bar-h) + 20px + var(--safe-bottom));
      overflow-y:auto;
    }
    #home h1 {
      font-size:24px;
      font-weight:800;
      margin-bottom:4px;
    }
    #home .sub {
      color:var(--ui-text-muted);
      font-weight:600;
      font-size:14px;
      margin-bottom:18px;
    }
    .template-group {
      margin-bottom:24px;
    }
    .template-group h2 {
      font-size:14px;
      font-weight:700;
      color:var(--ui-text-muted);
      text-transform:uppercase;
      letter-spacing:0.04em;
      margin-bottom:10px;
    }
    .template-grid {
      display:grid;
      grid-template-columns:repeat(auto-fill, minmax(140px,1fr));
      gap:12px;
    }
    .template-card {
      background:var(--ui-surface);
      border-radius:var(--ui-radius-md);
      border:1px solid var(--ui-border);
      padding:12px 10px 14px;
      text-align:center;
      box-shadow:var(--ui-shadow-xs);
      transition:transform 0.1s, border-color 0.15s, box-shadow 0.15s;
      touch-action:manipulation;
    }
    .template-card:active {
      transform:scale(0.97);
      border-color:var(--ui-accent);
      box-shadow:var(--ui-shadow-accent);
    }
    .template-card .thumb {
      width:100%;
      aspect-ratio:9/16;
      background:var(--ui-canvas);
      border-radius:var(--ui-radius-sm);
      margin-bottom:8px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:11px;
      font-weight:600;
      color:var(--ui-text-soft);
      background:linear-gradient(145deg, var(--ui-surface-2), var(--ui-surface));
      overflow:hidden;
    }
    .template-card .thumb svg {
      width:40px; height:40px;
      color:var(--ui-text-soft);
    }
    .template-card .name {
      font-weight:700;
      font-size:13px;
      color:var(--ui-text);
    }
    .template-card .badge {
      font-size:9px;
      font-weight:700;
      color:var(--ui-accent-ink);
      background:var(--ui-accent-soft);
      padding:2px 8px;
      border-radius:var(--ui-radius-pill);
      display:inline-block;
      margin-top:4px;
    }

    /* ================================================================
       PANTALLA EDITOR
       ================================================================ */
    #editor {
      flex:1;
      display:none;
      flex-direction:column;
      background:var(--ui-bg);
    }
    #editor.active { display:flex; }

    .editor-header {
      display:flex;
      align-items:center;
      gap:10px;
      padding:12px 16px;
      background:var(--ui-surface);
      border-bottom:1px solid var(--ui-border);
      flex-shrink:0;
    }
    .editor-header .back-btn {
      width:40px; height:40px;
      display:flex;
      align-items:center;
      justify-content:center;
      border-radius:var(--ui-radius-pill);
      background:var(--ui-surface-2);
      color:var(--ui-text-muted);
      transition:0.15s;
    }
    .editor-header .back-btn:active { background:var(--ui-accent-soft); }
    .editor-header .title {
      flex:1;
      font-weight:800;
      font-size:16px;
    }
    .editor-header .step-indicator {
      font-size:12px;
      font-weight:600;
      color:var(--ui-text-muted);
      background:var(--ui-surface-2);
      padding:4px 12px;
      border-radius:var(--ui-radius-pill);
    }

    /* pasos */
    .step-container {
      flex:1;
      overflow-y:auto;
      padding:16px 16px calc(var(--bottom-bar-h) + 20px + var(--safe-bottom));
    }
    .step {
      display:none;
      animation:fadeStep 0.2s ease;
    }
    .step.active { display:block; }
    @keyframes fadeStep { from{opacity:0;transform:translateY(6px);} to{opacity:1;transform:translateY(0);} }
    .step h3 {
      font-size:18px;
      font-weight:800;
      margin-bottom:6px;
    }
    .step p.desc {
      color:var(--ui-text-muted);
      font-weight:500;
      font-size:13px;
      margin-bottom:16px;
    }
    .step label {
      display:block;
      font-size:12px;
      font-weight:700;
      color:var(--ui-text-muted);
      margin:14px 0 4px;
    }
    .step input, .step select, .step textarea {
      width:100%;
      padding:12px 14px;
      font-size:15px;
      border:1.5px solid var(--ui-border);
      border-radius:var(--ui-radius-sm);
      background:var(--ui-surface-2);
      color:var(--ui-text);
      font-weight:600;
      font-family:inherit;
      transition:0.15s;
      min-height:44px;
    }
    .step input:focus, .step select:focus, .step textarea:focus {
      outline:none;
      border-color:var(--ui-accent);
      background:var(--ui-surface);
      box-shadow:0 0 0 3px var(--ui-accent-soft);
    }
    .step textarea { min-height:80px; resize:vertical; }
    .step .file-row {
      display:flex;
      align-items:center;
      gap:12px;
      background:var(--ui-surface-2);
      padding:10px 14px;
      border-radius:var(--ui-radius-sm);
      border:1.5px dashed var(--ui-border-strong);
      margin-bottom:6px;
    }
    .step .file-row input[type="file"] { border:none; padding:0; background:transparent; }
    .step .file-row img.mini {
      width:40px; height:40px;
      object-fit:contain;
      border-radius:6px;
      border:1px solid var(--ui-border);
      background:var(--ui-surface);
    }
    .step .file-row .remove-btn {
      margin-left:auto;
      width:32px; height:32px;
      border-radius:var(--ui-radius-pill);
      background:var(--ui-danger-soft);
      color:var(--ui-danger);
      font-weight:800;
      font-size:14px;
    }
    .step .btn-row {
      display:flex;
      gap:10px;
      margin-top:18px;
    }
    .step .btn-row .btn {
      flex:1;
      padding:14px;
      border-radius:var(--ui-radius-sm);
      font-weight:800;
      font-size:14px;
      text-align:center;
      transition:0.15s;
    }
    .step .btn-row .btn-primary { background:var(--ui-accent); color:#fff; box-shadow:var(--ui-shadow-accent); }
    .step .btn-row .btn-secondary { background:var(--ui-surface-2); color:var(--ui-text-muted); border:1.5px solid var(--ui-border); }
    .step .btn-row .btn:active { transform:scale(0.97); }
    .step .btn-row .btn:disabled { opacity:0.5; pointer-events:none; }

    /* ================================================================
       VISTA PREVIA / CANVAS
       ================================================================ */
    #canvas-wrap {
      flex:1;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      background:var(--ui-canvas);
      padding:16px;
      overflow:hidden;
      position:relative;
    }
    #canvas-wrap .canvas-frame {
      width:100%;
      max-width:340px;
      aspect-ratio:9/16;
      background:var(--ui-surface);
      border-radius:20px;
      box-shadow:var(--ui-shadow-lg);
      overflow:hidden;
      position:relative;
      border:4px solid var(--ui-surface);
    }
    #canvas-wrap .canvas-frame .scaler {
      transform-origin:top left;
      width:1080px;
      height:1920px;
    }
    #canvas-wrap .canvas-frame .scaler .card {
      width:1080px;
      height:1920px;
      border-radius:0;
      background:transparent;
      position:relative;
      overflow:hidden;
    }
    /* Los estilos de los flyers se reutilizan del archivo original,
       pero los incluimos más abajo para mantener la coherencia */

    /* ================================================================
       BARRA INFERIOR CONTEXTUAL (edición de elementos)
       ================================================================ */
    .context-bar {
      position:fixed;
      bottom:0;
      left:0;
      right:0;
      z-index:300;
      background:var(--ui-surface);
      border-top:1px solid var(--ui-border);
      padding:8px 12px calc(8px + var(--safe-bottom));
      display:none;
      gap:6px;
      flex-wrap:wrap;
      align-items:center;
      justify-content:center;
      box-shadow:var(--ui-shadow-lg);
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
    }
    .context-bar.active { display:flex; }
    .context-bar .ctx-btn {
      min-height:44px;
      min-width:44px;
      padding:8px 14px;
      border-radius:var(--ui-radius-pill);
      background:var(--ui-surface-2);
      color:var(--ui-text);
      font-weight:700;
      font-size:12px;
      display:flex;
      align-items:center;
      gap:6px;
      border:1px solid var(--ui-border);
      transition:0.15s;
      touch-action:manipulation;
    }
    .context-bar .ctx-btn:active {
      background:var(--ui-accent-soft);
      border-color:var(--ui-accent);
    }
    .context-bar .ctx-btn.danger { color:var(--ui-danger); }
    .context-bar .ctx-btn svg { width:18px; height:18px; }

    /* ================================================================
       MODAL CROPPER (reutilizado)
       ================================================================ */
    .modal-overlay {
      position:fixed; top:0; left:0; width:100vw; height:100vh;
      background:rgba(8,12,28,0.72);
      backdrop-filter:blur(6px);
      -webkit-backdrop-filter:blur(6px);
      display:none;
      align-items:center;
      justify-content:center;
      z-index:9999;
      padding:16px;
    }
    .modal-overlay.active { display:flex; animation:modalFade 0.18s ease; }
    @keyframes modalFade { from{opacity:0;} to{opacity:1;} }
    .modal-content {
      background:var(--ui-surface);
      border-radius:var(--ui-radius-lg);
      width:100%;
      max-width:480px;
      padding:24px;
      box-shadow:var(--ui-shadow-lg);
    }
    .modal-content h3 { font-size:17px; font-weight:800; margin-bottom:12px; text-align:center; }
    .img-container {
      width:100%; height:280px;
      background:
        linear-gradient(45deg, var(--ui-surface-2) 25%, transparent 25%, transparent 75%, var(--ui-surface-2) 75%, var(--ui-surface-2)),
        linear-gradient(45deg, var(--ui-surface-2) 25%, var(--ui-surface-3) 25%, var(--ui-surface-3) 75%, var(--ui-surface-2) 75%, var(--ui-surface-2));
      background-size:20px 20px;
      background-position:0 0, 10px 10px;
      margin-bottom:12px;
      overflow:hidden;
      border-radius:var(--ui-radius-md);
    }
    .img-container img { max-width:100%; }
    .modal-hint { font-size:11.5px; color:var(--ui-text-muted); text-align:center; margin:-4px 0 14px; font-weight:600; }
    .modal-actions { display:flex; gap:10px; }
    .modal-actions .btn { flex:1; padding:14px; border-radius:var(--ui-radius-sm); font-weight:800; font-size:13px; text-align:center; }
    .modal-actions .btn-primary { background:var(--ui-accent); color:#fff; }
    .modal-actions .btn-outline { background:var(--ui-surface-2); border:1.5px solid var(--ui-border); color:var(--ui-text-muted); }

    /* ================================================================
       TOAST
       ================================================================ */
    .toast-stack {
      position:fixed;
      left:50%; top:calc(var(--app-bar-h) + 10px);
      transform:translateX(-50%);
      z-index:10000;
      display:flex;
      flex-direction:column;
      gap:8px;
      align-items:center;
      pointer-events:none;
      width:min(92vw,380px);
    }
    .toast {
      display:flex; align-items:center; gap:10px;
      background:var(--ui-surface); color:var(--ui-text);
      padding:12px 16px 12px 12px;
      border-radius:var(--ui-radius-md);
      font-size:12.5px; font-weight:700;
      box-shadow:var(--ui-shadow-lg);
      border:1px solid var(--ui-border);
      opacity:0; transform:translateY(-10px);
      animation:toastIn 0.25s ease forwards, toastOut 0.25s ease forwards 2.6s;
    }
    .toast svg { width:26px; height:26px; padding:6px; box-sizing:border-box; color:var(--ui-success); background:var(--ui-success-soft); border-radius:50%; flex-shrink:0; }
    @keyframes toastIn { to{opacity:1;transform:translateY(0);} }
    @keyframes toastOut { to{opacity:0;transform:translateY(-8px);} }

    /* ================================================================
       ESTILOS DE FLYERS (copiados del original, sin modificar)
       ================================================================ */
    /* ---------- DISEÑO DEL FLYER – FONDO DE ESTADIO ---------- */
    .card {
      border-radius:0 !important;
      background:transparent !important;
      overflow:hidden;
      position:relative;
    }
    .card-916 { height:1920px; width:1080px; }
    .card-11 { height:1080px; width:1080px; }
    .card-content {
      position:relative;
      width:100%;
      height:100%;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      padding:40px 50px;
      z-index:4;
      color:#fff;
      background-color:#0B132B;
    }
    .card-916 .card-content { padding-top:130px !important; }
    .flyer-background {
      position:absolute;
      top:0; left:0;
      width:100%; height:100%;
      z-index:1;
      background-color:#0B132B;
      background-image:
        radial-gradient(ellipse at 30% 10%, rgba(46,134,171,0.25) 0%, transparent 50%),
        radial-gradient(ellipse at 70% 10%, rgba(46,134,171,0.25) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 30%, rgba(255,255,255,0.04) 0%, transparent 60%),
        radial-gradient(ellipse at 20% 0%, rgba(46,134,171,0.15) 0%, transparent 30%),
        radial-gradient(ellipse at 80% 0%, rgba(46,134,171,0.15) 0%, transparent 30%),
        linear-gradient(180deg, #0B132B 0%, #141E3A 30%, #1A2A6C 100%);
      background-size:cover;
      background-position:center;
    }
    .flyer-background.has-bg-img { background:none !important; }
    .flyer-overlay {
      position:absolute; top:0; left:0; width:100%; height:100%; z-index:2;
      background:radial-gradient(ellipse at 50% 50%, transparent 20%, rgba(0,0,0,0.15) 50%, rgba(0,0,0,0.55) 100%);
      pointer-events:none;
    }
    .flyer-texture {
      position:absolute; top:0; left:0; width:100%; height:100%; z-index:3;
      pointer-events:none;
      background-image:
        repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 2px, transparent 2px, transparent 20px),
        url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      background-blend-mode:overlay;
    }
    .flyer-header {
      display:flex; align-items:center; gap:20px; margin-bottom:10px; position:relative; z-index:5;
    }
    .flyer-header .club-crest { width:70px; height:70px; flex-shrink:0; filter:drop-shadow(0 4px 12px rgba(0,0,0,0.4)); }
    .flyer-header .club-crest img { width:100%; height:100%; object-fit:contain; }
    .flyer-header .club-name { display:flex; flex-direction:column; font-family:'Montserrat',sans-serif; font-weight:800; text-transform:uppercase; line-height:1.1; letter-spacing:0.04em; }

    .card.text-bg .flyer-title { background:rgba(0,0,0,0.35); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); padding:6px 20px; border-radius:16px; display:inline-block; margin-bottom:6px; }
    .card.text-bg .flyer-info { background:rgba(0,0,0,0.30); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); padding:16px 20px; border-radius:16px; border:1px solid rgba(255,255,255,0.08); }
    .card.text-bg .flyer-teams { background:rgba(0,0,0,0.25); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); padding:20px 30px; border-radius:24px; border:1px solid rgba(255,255,255,0.06); }
    .card.text-bg .flyer-resultado { background:rgba(0,0,0,0.25); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); padding:20px 30px; border-radius:24px; border:1px solid rgba(255,255,255,0.06); }
    .card.text-bg .flyer-competition { background:rgba(0,0,0,0.35); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); padding:8px 20px; border-radius:30px; display:inline-block; }
    .card.text-bg .flyer-slogan { background:rgba(0,0,0,0.30); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); padding:4px 20px; border-radius:30px; display:inline-block; }
    .card.text-bg .flyer-sponsor { background:rgba(0,0,0,0.20); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); padding:6px 16px; border-radius:16px; display:inline-block; }
    .card.text-bg .flyer-schedule { background:rgba(0,0,0,0.25); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); padding:16px 20px; border-radius:16px; border:1px solid rgba(255,255,255,0.08); }
    .card.text-bg .flyer-accesos { background:rgba(0,0,0,0.25); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); padding:10px 20px; border-radius:16px; border:1px solid rgba(255,255,255,0.08); }
    .card.text-bg .flyer-generico .gen-texto { background:rgba(0,0,0,0.30); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); padding:10px 24px; border-radius:20px; display:inline-block; }
    .card.text-bg .flyer-generico .gen-img-frame { border:2px solid rgba(255,255,255,0.15); box-shadow:0 20px 40px rgba(0,0,0,0.6); }

    /* ================================================================
       RESPONSIVE (mobile only)
       ================================================================ */
    @media (max-width: 850px) {
      .app-bar-text small { display:none; }
      #home { padding:12px 12px calc(var(--bottom-bar-h) + 16px + var(--safe-bottom)); }
      .template-grid { grid-template-columns:repeat(auto-fill, minmax(120px,1fr)); }
      .template-card .thumb { aspect-ratio:9/16; }
      .step-container { padding:12px 12px calc(var(--bottom-bar-h) + 16px + var(--safe-bottom)); }
      .context-bar { padding:6px 8px calc(6px + var(--safe-bottom)); }
      .context-bar .ctx-btn { padding:6px 10px; font-size:11px; }
    }
    @media (max-width: 400px) {
      .template-grid { grid-template-columns:repeat(auto-fill, minmax(100px,1fr)); }
    }
  </style>
</head>
<body>

  <!-- APP BAR -->
  <header class="app-bar">
    <div class="app-bar-brand">
      <span class="app-bar-crest">CA</span>
      <div class="app-bar-text">
        <strong>Flyers Cerámica</strong>
        <small>Club Social y Deportivo</small>
      </div>
    </div>
    <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Cambiar tema">
      <svg class="ico-sun" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="10" cy="10" r="3.4"/><path d="M10 2.5v2M10 15.5v2M4 4l1.4 1.4M14.6 14.6L16 16M2.5 10h2M15.5 10h2M4 16l1.4-1.4M14.6 5.4L16 4"/></svg>
      <svg class="ico-moon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 12.3A6.8 6.8 0 017.7 3.5a6.8 6.8 0 108.8 8.8z"/></svg>
    </button>
  </header>

  <!-- PANTALLA INICIO -->
  <div id="home">
    <h1>Crear nuevo flyer</h1>
    <p class="sub">Elegí una plantilla para empezar a diseñar</p>

    <!-- Galería de plantillas (agrupadas) -->
    <div id="template-gallery"></div>
  </div>

  <!-- PANTALLA EDITOR -->
  <div id="editor">
    <div class="editor-header">
      <button class="back-btn" id="editor-back">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4.5L5.5 10 15 15.5"/></svg>
      </button>
      <span class="title" id="editor-title">Editar</span>
      <span class="step-indicator" id="step-indicator">1 / 4</span>
    </div>

    <div class="step-container" id="step-container">
      <!-- Cada paso se genera dinámicamente, pero aquí van los contenedores -->
      <div class="step active" data-step="1" id="step-content"></div>
      <div class="step" data-step="2" id="step-images"></div>
      <div class="step" data-step="3" id="step-design"></div>
      <div class="step" data-step="4" id="step-preview">
        <div id="canvas-wrap">
          <div class="canvas-frame">
            <div class="scaler" id="preview-scaler">
              <div class="card card-916" id="preview-card"></div>
            </div>
          </div>
        </div>
        <div style="padding:12px 16px; text-align:center; background:var(--ui-surface); border-top:1px solid var(--ui-border);">
          <button class="btn btn-primary" id="export-btn" style="width:100%; padding:14px; border-radius:var(--ui-radius-sm); font-weight:800; font-size:15px; background:var(--ui-accent); color:#fff; box-shadow:var(--ui-shadow-accent);">Exportar imagen</button>
        </div>
      </div>
    </div>

    <!-- Barra de navegación inferior (pasos) -->
    <div style="position:fixed; bottom:0; left:0; right:0; z-index:200; background:var(--ui-surface); border-top:1px solid var(--ui-border); padding:8px 16px calc(8px + var(--safe-bottom)); display:flex; gap:10px;">
      <button class="btn btn-secondary" id="step-prev" style="flex:1; padding:12px; border-radius:var(--ui-radius-sm); font-weight:700; font-size:13px; background:var(--ui-surface-2); border:1.5px solid var(--ui-border); color:var(--ui-text-muted);">Anterior</button>
      <button class="btn btn-primary" id="step-next" style="flex:2; padding:12px; border-radius:var(--ui-radius-sm); font-weight:700; font-size:13px; background:var(--ui-accent); color:#fff; box-shadow:var(--ui-shadow-accent);">Continuar</button>
    </div>
  </div>

  <!-- CONTEXT BAR (edición de elementos) -->
  <div class="context-bar" id="context-bar"></div>

  <!-- MODAL CROPPER -->
  <div class="modal-overlay" id="cropModal">
    <div class="modal-content">
      <h3 id="cropModalTitle">Ajustar imagen</h3>
      <div class="img-container"><img id="cropImage" src="" alt="Ajustar"></div>
      <p id="cropModalHint" class="modal-hint" style="display:none;">Arrastrá la imagen y usá los dedos para hacer zoom.</p>
      <div class="modal-actions">
        <button class="btn btn-primary" id="btnCropSave">Confirmar</button>
        <button class="btn btn-outline" id="btnCropCancel">Cancelar</button>
      </div>
    </div>
  </div>

  <!-- TOAST -->
  <div class="toast-stack" id="toast-stack"></div>

  <!-- ================================================================
       SCRIPTS
       ================================================================ -->
  <script>
    // ================================================================
    // 1. STATE
    // ================================================================
    const STATE = {
      template: null,          // identificador de plantilla
      mode: 'VS',              // VS, LIBRE, RESULTADO, GENERICO, FOTO, JUGADOR, EQUIPO, LISTA, FIXTURE, CALENDARIO
      category: 'PRIMERA',
      fields: {},              // campos específicos
      images: {
        local: null,
        rival: null,
        sponsor: null,
        background: null,
        foto: null,
        generico916: null,
        generico11: null,
        genericoBlur916: null,
        genericoBlur11: null,
      },
      generico: {
        posX: 50, posY: 50, zoom: 100,
        style: 'tradicional',
        showHeader: true, showCategoria: true, showTitulo: true,
        showTexto: true, showSponsors: true, showFooter: true
      },
      foto: {
        src: null,
        natural: { w:0, h:0 },
        state916: null,
        state11: null,
        init916: null,
        init11: null
      },
      // personalización
      font: 'jakarta',
      textBg: false,
      shieldSize: 200,
      // visibilidad común
      visible: {
        header: true, category: true, title: true,
        info: true, teams: true, footer: true, sponsors: true
      },
      // escalado y posición
      scales: {
        header:100, catsub:100, title:100, info:100,
        teams:100, accesos:100, footer:100, sponsor:100,
        gentexto:100, genblock:100
      },
      positions: {
        header:{x:0,y:0}, catsub:{x:0,y:0}, title:{x:0,y:0},
        info:{x:0,y:0}, teams:{x:0,y:0}, accesos:{x:0,y:0},
        footer:{x:0,y:0}, sponsor:{x:0,y:0},
        gentexto:{x:0,y:0}, genblock:{x:0,y:0}
      },
      // elementos del editor (para modo genérico y futuras plantillas)
      elements: [],
      selectedElement: null,
    };

    // ================================================================
    // 2. TEMPLATES
    // ================================================================
    const TEMPLATES = [
      // PARTIDOS
      { id:'vs', group:'PARTIDOS', label:'Partido', mode:'VS', icon:'🏟️' },
      { id:'proximo', group:'PARTIDOS', label:'Próximo partido', mode:'VS', icon:'⏳' },
      { id:'resultado', group:'PARTIDOS', label:'Resultado', mode:'RESULTADO', icon:'⚽' },
      // EQUIPO
      { id:'equipo-titular', group:'EQUIPO', label:'Equipo titular', mode:'EQUIPO', icon:'👥' },
      { id:'lista-concentrados', group:'EQUIPO', label:'Lista de concentrados', mode:'LISTA', icon:'📋' },
      { id:'jugador-partido', group:'EQUIPO', label:'Jugador del partido', mode:'JUGADOR', icon:'⭐' },
      { id:'plantel', group:'EQUIPO', label:'Plantel', mode:'GENERICO', icon:'🏆' },
      // COMPETENCIA
      { id:'fixture', group:'COMPETENCIA', label:'Fixture', mode:'FIXTURE', icon:'📅' },
      { id:'calendario', group:'COMPETENCIA', label:'Calendario', mode:'CALENDARIO', icon:'📆' },
      { id:'tabla', group:'COMPETENCIA', label:'Tabla / posición', mode:'GENERICO', icon:'📊' },
      // COMUNICACIÓN
      { id:'flyer-generico', group:'COMUNICACIÓN', label:'Flyer genérico', mode:'GENERICO', icon:'📝' },
      { id:'comunicado', group:'COMUNICACIÓN', label:'Comunicado', mode:'GENERICO', icon:'📢' },
      { id:'agradecimiento', group:'COMUNICACIÓN', label:'Agradecimiento', mode:'GENERICO', icon:'🙏' },
      { id:'anuncio', group:'COMUNICACIÓN', label:'Anuncio', mode:'GENERICO', icon:'📣' },
      { id:'cumpleaños', group:'COMUNICACIÓN', label:'Cumpleaños', mode:'GENERICO', icon:'🎂' },
      { id:'felicitaciones', group:'COMUNICACIÓN', label:'Felicitaciones', mode:'GENERICO', icon:'👏' },
      // FOTO
      { id:'foto-equipo', group:'FOTO', label:'Foto del equipo', mode:'FOTO', icon:'📸' },
      { id:'foto-partido', group:'FOTO', label:'Foto del partido', mode:'FOTO', icon:'📷' },
      { id:'foto-libre', group:'FOTO', label:'Foto libre', mode:'FOTO', icon:'🖼️' },
    ];

    // ================================================================
    // 3. UI HELPERS
    // ================================================================
    function $(sel) { return document.querySelector(sel); }
    function $$(sel) { return document.querySelectorAll(sel); }

    function showToast(msg) {
      const stack = document.getElementById('toast-stack');
      if (!stack) return;
      const t = document.createElement('div');
      t.className = 'toast';
      t.innerHTML = `<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5l3.8 3.8L16 6"/></svg><span>${msg}</span>`;
      stack.appendChild(t);
      setTimeout(() => t.remove(), 3000);
    }

    // ================================================================
    // 4. GALERÍA
    // ================================================================
    function renderGallery() {
      const container = document.getElementById('template-gallery');
      if (!container) return;
      const groups = {};
      TEMPLATES.forEach(t => {
        if (!groups[t.group]) groups[t.group] = [];
        groups[t.group].push(t);
      });
      let html = '';
      for (const [group, items] of Object.entries(groups)) {
        html += `<div class="template-group"><h2>${group}</h2><div class="template-grid">`;
        items.forEach(t => {
          html += `
            <div class="template-card" data-template="${t.id}" data-mode="${t.mode}">
              <div class="thumb"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4" width="15" height="12" rx="1.5"/><path d="M7.5 8.5a2 2 0 100-4 2 2 0 000 4zM17.5 14.5l-4-4-3 3-2-2-4 4"/></svg></div>
              <div class="name">${t.label}</div>
              <span class="badge">${t.group}</span>
            </div>
          `;
        });
        html += '</div></div>';
      }
      container.innerHTML = html;

      // Eventos
      container.querySelectorAll('.template-card').forEach(card => {
        card.addEventListener('click', () => {
          const templateId = card.dataset.template;
          const mode = card.dataset.mode;
          openEditor(templateId, mode);
        });
      });
    }

    // ================================================================
    // 5. EDITOR – NAVEGACIÓN
    // ================================================================
    let currentStep = 1;
    const totalSteps = 4;

    function openEditor(templateId, mode) {
      STATE.template = templateId;
      STATE.mode = mode;
      // Cargar campos según plantilla (por ahora usamos los mismos para todos, luego se puede extender)
      // Inicializar STATE.fields con valores por defecto
      STATE.fields = {
        brand1: 'CLUB SOCIAL Y DEPORTIVO',
        brand2: 'CERÁMICA ARGENTINA',
        t1: 'PRÓXIMO',
        t2: 'PARTIDO',
        subtitle: 'AMISTOSO',
        estadio: 'ESTADIO HECTOR C. CARDOSO',
        estadioSub: 'CLUB CERAMICA',
        hora: '15:00',
        fecha: new Date().toISOString().slice(0,10),
        condicion: 'LOCAL',
        rival: 'MOQUEHUA',
        golesLocal: 2,
        golesRival: 1,
        footSlogan: '¡VAMOS CERA!',
        footR1: 'LIGA CHIVILCOYANA DE FUTBOL',
        footR2: 'TORNEO AÑO 2026',
        accLocal: 'SERGIO "PELA" GIROTTI X CALLE ALEM',
        accVisit: 'SOBRE CALLE BROWN',
        genTexto: '¡Gracias por acompañarnos siempre!',
        // Para nuevas plantillas
        jugadorNombre: '',
        jugadorNumero: '',
        jugadorCategoria: '',
        jugadorRival: '',
        jugadorFecha: '',
        jugadorCompetencia: '',
        formacion: '4-3-3',
        // fixture / calendario: arrays
        fixtureItems: [],
        calendarioItems: [],
        listaJugadores: [],
      };
      // Resetear imágenes
      STATE.images = { local:null, rival:null, sponsor:null, background:null, foto:null, generico916:null, generico11:null, genericoBlur916:null, genericoBlur11:null };
      STATE.foto.src = null;
      // Mostrar editor
      document.getElementById('home').style.display = 'none';
      document.getElementById('editor').classList.add('active');
      document.getElementById('editor-title').textContent = TEMPLATES.find(t => t.id === templateId)?.label || 'Editar';
      // Cargar paso 1
      currentStep = 1;
      renderStep(currentStep);
      updateStepUI();
    }

    function closeEditor() {
      document.getElementById('editor').classList.remove('active');
      document.getElementById('home').style.display = 'block';
      document.getElementById('context-bar').classList.remove('active');
    }

    function renderStep(step) {
      // Ocultar todos los pasos
      $$('.step').forEach(s => s.classList.remove('active'));
      const container = document.getElementById('step-container');
      const stepEl = container.querySelector(`.step[data-step="${step}"]`);
      if (!stepEl) return;
      stepEl.classList.add('active');

      // Generar contenido según el paso
      if (step === 1) renderContentStep(stepEl);
      else if (step === 2) renderImagesStep(stepEl);
      else if (step === 3) renderDesignStep(stepEl);
      else if (step === 4) renderPreviewStep(stepEl);

      updateStepUI();
    }

    function updateStepUI() {
      document.getElementById('step-indicator').textContent = `${currentStep} / ${totalSteps}`;
      document.getElementById('step-prev').disabled = (currentStep === 1);
      const nextBtn = document.getElementById('step-next');
      if (currentStep === totalSteps) {
        nextBtn.textContent = 'Finalizar';
      } else {
        nextBtn.textContent = 'Continuar';
      }
    }

    // ================================================================
    // 6. PASOS – CONTENIDO
    // ================================================================
    function renderContentStep(container) {
      const f = STATE.fields;
      let html = `
        <h3>Contenido</h3>
        <p class="desc">Completá los datos principales del flyer.</p>
        <label>Línea 1</label><input type="text" id="f-brand1" value="${f.brand1}">
        <label>Línea 2</label><input type="text" id="f-brand2" value="${f.brand2}">
        <label>Título superior</label><input type="text" id="f-t1" value="${f.t1}">
        <label>Título principal</label><input type="text" id="f-t2" value="${f.t2}">
        <label>Subtítulo</label><input type="text" id="f-subtitle" value="${f.subtitle}">
        <label>Categoría</label>
        <select id="f-category">
          <option value="PRIMERA" ${STATE.category==='PRIMERA'?'selected':''}>Primera</option>
          <option value="SENIORS" ${STATE.category==='SENIORS'?'selected':''}>Seniors</option>
          <option value="INFERIORES" ${STATE.category==='INFERIORES'?'selected':''}>Inferiores</option>
        </select>
        <label>Estadio</label><input type="text" id="f-estadio" value="${f.estadio}">
        <label>Fecha</label><input type="date" id="f-fecha" value="${f.fecha}">
        <label>Hora</label><input type="time" id="f-hora" value="${f.hora}">
        <label>Condición</label>
        <select id="f-condicion">
          <option value="LOCAL" ${f.condicion==='LOCAL'?'selected':''}>Local</option>
          <option value="VISITANTE" ${f.condicion==='VISITANTE'?'selected':''}>Visitante</option>
        </select>
        <label>Nombre rival</label><input type="text" id="f-rival" value="${f.rival}">
        <label>Slogan pie</label><input type="text" id="f-slogan" value="${f.footSlogan}">
        <label>Pie R1</label><input type="text" id="f-footr1" value="${f.footR1}">
        <label>Pie R2</label><input type="text" id="f-footr2" value="${f.footR2}">
        <label>Acceso Local</label><input type="text" id="f-acclocal" value="${f.accLocal}">
        <label>Acceso Visitante</label><input type="text" id="f-accvisit" value="${f.accVisit}">
        <label>Texto libre (Genérico)</label><textarea id="f-gentexto">${f.genTexto}</textarea>
      `;
      container.innerHTML = html;
      // Bind events
      container.querySelectorAll('input, select, textarea').forEach(el => {
        el.addEventListener('input', () => {
          const id = el.id;
          if (id === 'f-category') STATE.category = el.value;
          else if (id === 'f-brand1') STATE.fields.brand1 = el.value;
          else if (id === 'f-brand2') STATE.fields.brand2 = el.value;
          else if (id === 'f-t1') STATE.fields.t1 = el.value;
          else if (id === 'f-t2') STATE.fields.t2 = el.value;
          else if (id === 'f-subtitle') STATE.fields.subtitle = el.value;
          else if (id === 'f-estadio') STATE.fields.estadio = el.value;
          else if (id === 'f-fecha') STATE.fields.fecha = el.value;
          else if (id === 'f-hora') STATE.fields.hora = el.value;
          else if (id === 'f-condicion') STATE.fields.condicion = el.value;
          else if (id === 'f-rival') STATE.fields.rival = el.value;
          else if (id === 'f-slogan') STATE.fields.footSlogan = el.value;
          else if (id === 'f-footr1') STATE.fields.footR1 = el.value;
          else if (id === 'f-footr2') STATE.fields.footR2 = el.value;
          else if (id === 'f-acclocal') STATE.fields.accLocal = el.value;
          else if (id === 'f-accvisit') STATE.fields.accVisit = el.value;
          else if (id === 'f-gentexto') STATE.fields.genTexto = el.value;
          updatePreview();
        });
      });
    }

    // ================================================================
    // 7. PASOS – IMÁGENES
    // ================================================================
    function renderImagesStep(container) {
      const imgs = STATE.images;
      let html = `
        <h3>Imágenes</h3>
        <p class="desc">Cargá las imágenes que necesites para tu flyer.</p>
        <label>Escudo Cerámica</label>
        <div class="file-row">
          <img class="mini" id="mini-local" src="${imgs.local||''}" style="${imgs.local?'display:block':'display:none'}">
          <input type="file" accept="image/*" id="file-local">
          ${imgs.local ? `<button class="remove-btn" data-target="local">×</button>` : ''}
        </div>
        <label>Escudo Rival</label>
        <div class="file-row">
          <img class="mini" id="mini-rival" src="${imgs.rival||''}" style="${imgs.rival?'display:block':'display:none'}">
          <input type="file" accept="image/*" id="file-rival">
          ${imgs.rival ? `<button class="remove-btn" data-target="rival">×</button>` : ''}
        </div>
        <label>Sponsor</label>
        <div class="file-row">
          <img class="mini" id="mini-sponsor" src="${imgs.sponsor||''}" style="${imgs.sponsor?'display:block':'display:none'}">
          <input type="file" accept="image/*" id="file-sponsor">
          ${imgs.sponsor ? `<button class="remove-btn" data-target="sponsor">×</button>` : ''}
        </div>
        <label>Fondo personalizado</label>
        <div class="file-row">
          <img class="mini" id="mini-background" src="${imgs.background||''}" style="${imgs.background?'display:block':'display:none'}">
          <input type="file" accept="image/*" id="file-background">
          ${imgs.background ? `<button class="remove-btn" data-target="background">×</button>` : ''}
        </div>
        <label>Foto (modo Foto)</label>
        <div class="file-row">
          <img class="mini" id="mini-foto" src="${STATE.foto.src||''}" style="${STATE.foto.src?'display:block':'display:none'}">
          <input type="file" accept="image/*" id="file-foto">
          ${STATE.foto.src ? `<button class="remove-btn" data-target="foto">×</button>` : ''}
        </div>
        <label>Imagen genérica (Historia 9:16)</label>
        <div class="file-row">
          <img class="mini" id="mini-generico916" src="${imgs.generico916||''}" style="${imgs.generico916?'display:block':'display:none'}">
          <input type="file" accept="image/*" id="file-generico916">
          ${imgs.generico916 ? `<button class="remove-btn" data-target="generico916">×</button>` : ''}
        </div>
        <label>Imagen genérica (Feed 1:1)</label>
        <div class="file-row">
          <img class="mini" id="mini-generico11" src="${imgs.generico11||''}" style="${imgs.generico11?'display:block':'display:none'}">
          <input type="file" accept="image/*" id="file-generico11">
          ${imgs.generico11 ? `<button class="remove-btn" data-target="generico11">×</button>` : ''}
        </div>
      `;
      container.innerHTML = html;

      // Eventos de carga
      container.querySelectorAll('input[type="file"]').forEach(input => {
        input.addEventListener('change', (e) => {
          const file = e.target.files[0];
          if (!file) return;
          const target = input.id.replace('file-','');
          const reader = new FileReader();
          reader.onload = (ev) => {
            const dataUrl = ev.target.result;
            // Guardar en STATE
            if (target === 'local') STATE.images.local = dataUrl;
            else if (target === 'rival') STATE.images.rival = dataUrl;
            else if (target === 'sponsor') STATE.images.sponsor = dataUrl;
            else if (target === 'background') STATE.images.background = dataUrl;
            else if (target === 'foto') {
              STATE.foto.src = dataUrl;
              // Inicializar estado de foto
              const img = new Image();
              img.onload = () => {
                STATE.foto.natural = { w:img.naturalWidth, h:img.naturalHeight };
                initFotoState();
                updatePreview();
              };
              img.src = dataUrl;
            } else if (target === 'generico916') {
              STATE.images.generico916 = dataUrl;
              // También guardamos la original para recortes
            } else if (target === 'generico11') {
              STATE.images.generico11 = dataUrl;
            }
            // Actualizar miniaturas
            const mini = document.getElementById('mini-'+target);
            if (mini) { mini.src = dataUrl; mini.style.display = 'block'; }
            // Agregar botón remover si no existe
            const row = input.closest('.file-row');
            if (row && !row.querySelector('.remove-btn')) {
              const btn = document.createElement('button');
              btn.className = 'remove-btn';
              btn.dataset.target = target;
              btn.textContent = '×';
              btn.addEventListener('click', () => removeImage(target));
              row.appendChild(btn);
            }
            updatePreview();
            saveState();
          };
          reader.readAsDataURL(file);
          input.value = '';
        });
      });

      // Botones remover
      container.querySelectorAll('.remove-btn').forEach(btn => {
        btn.addEventListener('click', () => removeImage(btn.dataset.target));
      });
    }

    function removeImage(target) {
      if (target === 'local') STATE.images.local = null;
      else if (target === 'rival') STATE.images.rival = null;
      else if (target === 'sponsor') STATE.images.sponsor = null;
      else if (target === 'background') STATE.images.background = null;
      else if (target === 'foto') { STATE.foto.src = null; STATE.foto.state916 = null; STATE.foto.state11 = null; }
      else if (target === 'generico916') STATE.images.generico916 = null;
      else if (target === 'generico11') STATE.images.generico11 = null;
      // Actualizar UI
      const mini = document.getElementById('mini-'+target);
      if (mini) { mini.src = ''; mini.style.display = 'none'; }
      const row = mini?.closest('.file-row');
      if (row) {
        const btn = row.querySelector('.remove-btn');
        if (btn) btn.remove();
      }
      updatePreview();
      saveState();
    }

    // ================================================================
    // 8. PASO – DISEÑO
    // ================================================================
    function renderDesignStep(container) {
      let html = `
        <h3>Diseño</h3>
        <p class="desc">Personalizá la apariencia del flyer.</p>

        ${renderScaleSlider('teams','Equipos')}
        ${renderScaleSlider('accesos','Accesos')}
        ${renderScaleSlider('footer','Pie')}
        ${renderScaleSlider('sponsor','Sponsor')}

        <button id="d-reset-positions" class="btn btn-secondary" style="width:100%; padding:12px; border-radius:var(--ui-radius-sm); background:var(--ui-surface-2); border:1.5px solid var(--ui-border); font-weight:700; font-size:13px;">Restablecer posiciones</button>
      `;

      // Bind events
      container.querySelectorAll('input, select').forEach(el => {
        el.addEventListener('input', () => {
          const id = el.id;
          if (id === 'd-font') STATE.font = el.value;
          else if (id === 'd-textbg') STATE.textBg = el.checked;
          else if (id === 'd-shield') { STATE.shieldSize = parseInt(el.value); document.getElementById('d-shield-label').textContent = STATE.shieldSize; }
          else if (id === 'd-show-header') STATE.visible.header = el.checked;
          else if (id === 'd-show-category') STATE.visible.category = el.checked;
          else if (id === 'd-show-title') STATE.visible.title = el.checked;
          else if (id === 'd-show-info') STATE.visible.info = el.checked;
          else if (id === 'd-show-teams') STATE.visible.teams = el.checked;
          else if (id === 'd-show-footer') STATE.visible.footer = el.checked;
          else if (id === 'd-show-sponsors') STATE.visible.sponsors = el.checked;
          else if (id.startsWith('scale-')) {
            const key = id.replace('scale-','');
            STATE.scales[key] = parseInt(el.value);
            document.getElementById('scale-label-'+key).textContent = el.value+'%';
          }
          updatePreview();
          saveState();

    function renderScaleSlider(key, label) {
      const val = STATE.scales[key] || 100;
      return `

    // ================================================================
    // 9. PASO – VISTA PREVIA
    // ================================================================
    function renderPreviewStep(container) {
      // Ya está el contenedor, solo actualizamos la vista previa
      updatePreview();

      document.getElementById('export-btn').addEventListener('click', exportFlyer);

    // ================================================================
    // 10. ACTUALIZAR VISTA PREVIA (renderizar flyer)
    // ================================================================
    function updatePreview() {
      const card = document.getElementById('preview-card');
      if (!card) return;
      const mode = STATE.mode;
      const html = buildFlyerHTML(mode);
      card.innerHTML = html;
      // Aplicar fuente y text-bg
      const fontClass = 'font-'+STATE.font;
      card.className = card.className.split(' ').filter(c => !c.startsWith('font-') && c !== 'text-bg').join(' ');
      card.classList.add(fontClass);
      if (STATE.textBg) card.classList.add('text-bg');
      // Aplicar escalado y posición (variables CSS)
      applyTransformations(card);
      // Ajustar escala del preview
      scalePreview();

    function buildFlyerHTML(mode) {
      // Función unificada que construye el flyer según modo
      // Reutilizamos las funciones del código original, pero adaptadas a STATE
      // Como son largas, aquí haremos una versión simplificada que llame a generadores
      // Para este demo, usaremos funciones inline similares a las originales
      // pero basadas en STATE.fields y STATE.images
      const f = STATE.fields;
      const imgs = STATE.images;
      const vis = STATE.visible;
      const shieldSize = STATE.shieldSize;
      const cat = STATE.category;

      function getShield(src, fallback) {
        if (src) return `<img src="${src}" alt="Escudo">`;
        return `<div class="generated-shield">${fallback}</div>`;
      }

      // Construir bloques comunes
      const headerHTML = vis.header ? `
        <div class="flyer-header">
          <div class="club-crest">${getShield(imgs.local, 'CERÁMICA')}</div>
          <div class="club-name"><span class="line1">${f.brand1}</span><span class="line2">${f.brand2}</span></div>
        </div>
      ` : '';

      const categoryHTML = vis.category ? `<div class="flyer-category">${cat}</div>` : '';
      const subtitleHTML = vis.category && f.subtitle ? `<div class="flyer-subtitle">${f.subtitle}</div>` : '';
      const titleHTML = vis.title ? `<div class="flyer-title"><span class="dyn-t1">${f.t1}</span><span class="dyn-t2">${f.t2}</span></div>` : '';

      const dateInfo = getDateInfo(f.fecha);
      const infoHTML = vis.info ? `
        <div class="flyer-info">
          <div class="info-item"><span class="info-day">${dateInfo.dayName}</span><span class="info-date">${dateInfo.formatted}</span></div>
          <div class="info-divider"></div>
          <div class="info-item"><span class="info-time">${f.hora}</span></div>
          <div class="info-divider"></div>
          <div class="info-item"><span class="info-label">ESTADIO</span><span class="info-stadium">${f.estadio}</span></div>
        </div>
      ` : '';

      const teamsHTML = vis.teams ? buildTeamsHTML(mode, f, imgs, shieldSize) : '';
      const accesosHTML = vis.info ? buildAccesosHTML(f) : '';
      const footerHTML = vis.footer ? `
        <div class="flyer-competition"><span class="dyn-foot-r1">${f.footR1}</span><span class="dyn-foot-r2">${f.footR2}</span></div>
        <div class="flyer-slogan">${f.footSlogan}</div>
      ` : '';
      const sponsorHTML = vis.sponsors && imgs.sponsor ? `<div class="flyer-sponsor"><img src="${imgs.sponsor}" alt="Sponsor"></div>` : '';

      // Fondo
      let bgHTML = imgs.background ? `
        <div class="flyer-background has-bg-img" style="position:absolute;top:0;left:0;width:100%;height:100%;z-index:1;overflow:hidden;">
          <img src="${imgs.background}" style="position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:1;">
        </div>
      ` : `<div class="flyer-background"></div>`;

      // Para modo FOTO
      if (mode === 'FOTO') {
        const fotoSrc = STATE.foto.src;
        let fotoLayer = '';
        if (fotoSrc) {
          const st = STATE.foto.state916 || { left:0, top:0, w:1080, h:1920 };
          fotoLayer = `<img class="foto-photo-img" src="${fotoSrc}" style="position:absolute;left:${st.left}px;top:${st.top}px;width:${st.w}px;height:${st.h}px;">`;
        } else {
          fotoLayer = `<div class="foto-canvas-placeholder"><span>Subí una foto</span></div>`;
        }
        return `
          <div class="card-content flyer-foto">
            ${bgHTML}
            <div class="flyer-background has-bg-img foto-canvas-layer" style="position:absolute;top:0;left:0;width:100%;height:100%;z-index:3;overflow:hidden;background:transparent !important;">
              ${fotoLayer}
            </div>
            ${headerHTML}
          </div>
        `;
      }

      // Modo GENÉRICO con imagen
      if (mode === 'GENERICO' && (imgs.generico916 || imgs.generico11)) {
        const src = imgs.generico916 || imgs.generico11;
        const zoom = STATE.generico.zoom / 100;
        const posX = STATE.generico.posX;
        const posY = STATE.generico.posY;
        const imgStyle = `position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;object-position:${posX}% ${posY}%;transform:scale(${zoom});z-index:1;`;
        const bgImg = `<div class="flyer-background has-bg-img" style="position:absolute;top:0;left:0;width:100%;height:100%;z-index:1;overflow:hidden;"><img src="${src}" style="${imgStyle}"></div>`;
        // Mostrar texto y elementos según checkboxes de genérico
        const g = STATE.generico;
        const genHeader = g.showHeader ? headerHTML : '';
        const genCat = g.showCategoria ? categoryHTML : '';
        const genSub = g.showCategoria && f.subtitle ? subtitleHTML : '';
        const genTitle = g.showTitulo ? titleHTML : '';
        const genTexto = g.showTexto && f.genTexto ? `<div class="flyer-generico-texto" style="font-size:28px;font-weight:700;color:#fff;text-align:center;text-shadow:0 2px 12px rgba(0,0,0,0.5);">${f.genTexto}</div>` : '';
        const genSponsor = g.showSponsors && imgs.sponsor ? sponsorHTML : '';
        const genFooter = g.showFooter ? footerHTML : '';
        return `
          <div class="card-content">
            ${bgImg}
            <div class="flyer-overlay"></div>
            <div class="flyer-texture"></div>
            <div style="display:flex;flex-direction:column;height:100%;position:relative;z-index:4;padding:30px 40px;">
              ${genHeader}
              ${genCat}
              ${genSub}
              ${genTitle}
              <div class="flyer-generico" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;">
                ${genTexto}
              </div>
              ${genSponsor}
              ${genFooter}
            </div>
          </div>

      // Modo LIBRE (cronograma)
      if (mode === 'LIBRE') {
        // Construir filas de horarios (simuladas con datos de STATE.fields o un array)
        const scheduleRows = `
          <div class="sched-row"><div class="sched-time">10:30 HS</div><div class="sched-cat">SUB 11</div></div>
          <div class="sched-row"><div class="sched-time">11:30 HS</div><div class="sched-cat">SUB 13</div></div>
          <div class="sched-row"><div class="sched-time">13:00 HS</div><div class="sched-cat">SUB 17</div></div>
          <div class="sched-row"><div class="sched-time">15:15 HS</div><div class="sched-cat">SUB 23</div></div>
        `;
        return `
          <div class="card-content">
            ${bgHTML}
            <div class="flyer-overlay"></div>
            <div class="flyer-texture"></div>
            ${headerHTML}
            ${categoryHTML}
            ${subtitleHTML}
            ${titleHTML}
            ${infoHTML}
            <div class="flyer-schedule">${scheduleRows}</div>
            ${accesosHTML}
            ${footerHTML}
            ${sponsorHTML}
          </div>
        `;
      }

      // Modo RESULTADO
      if (mode === 'RESULTADO') {
        const golesLocal = parseInt(f.golesLocal) || 0;
        const golesRival = parseInt(f.golesRival) || 0;
        const isLocal = f.condicion === 'LOCAL';
        const team1Shield = isLocal ? imgs.local : imgs.rival;
        const team1Name = isLocal ? 'CERÁMICA ARGENTINA' : f.rival.toUpperCase();
        const team2Shield = isLocal ? imgs.rival : imgs.local;
        const team2Name = isLocal ? f.rival.toUpperCase() : 'CERÁMICA ARGENTINA';
        const score1 = isLocal ? golesLocal : golesRival;
        const score2 = isLocal ? golesRival : golesLocal;
        const teamsResult = vis.teams ? `
          <div class="flyer-resultado">
            <div class="team home"><div class="team-crest" style="width:${shieldSize}px;height:${shieldSize}px;">${getShield(team1Shield, team1Name)}</div><div class="team-name">${team1Name}</div></div>
            <div class="score"><span>${score1}</span><span class="score-sep">-</span><span>${score2}</span></div>
            <div class="team away"><div class="team-crest" style="width:${shieldSize}px;height:${shieldSize}px;">${getShield(team2Shield, team2Name)}</div><div class="team-name">${team2Name}</div></div>
          </div>
        ` : '';
        return `
          <div class="card-content">
            ${bgHTML}
            <div class="flyer-overlay"></div>
            <div class="flyer-texture"></div>
            ${headerHTML}
            ${categoryHTML}
            ${subtitleHTML}
            ${titleHTML}
            ${teamsResult}
            ${footerHTML}
            ${sponsorHTML}
          </div>
        `;
      }

      // Modo VS (por defecto)
      const isLocal = f.condicion === 'LOCAL';
      const team1Shield = isLocal ? imgs.local : imgs.rival;
      const team1Name = isLocal ? 'CERÁMICA ARGENTINA' : f.rival.toUpperCase();
      const team2Shield = isLocal ? imgs.rival : imgs.local;
      const team2Name = isLocal ? f.rival.toUpperCase() : 'CERÁMICA ARGENTINA';
      const teamsVS = vis.teams ? `
        <div class="flyer-teams">
          <div class="team home"><div class="team-crest" style="width:${shieldSize}px;height:${shieldSize}px;">${getShield(team1Shield, team1Name)}</div><div class="team-name">${team1Name}</div></div>
          <div class="team-vs">VS</div>
          <div class="team away"><div class="team-crest" style="width:${shieldSize}px;height:${shieldSize}px;">${getShield(team2Shield, team2Name)}</div><div class="team-name">${team2Name}</div></div>
        </div>
      ` : '';
      return `
        <div class="card-content">
          ${bgHTML}
          <div class="flyer-overlay"></div>
          <div class="flyer-texture"></div>
          ${headerHTML}
          ${categoryHTML}
          ${subtitleHTML}
          ${titleHTML}
          ${teamsVS}
          ${infoHTML}
          ${accesosHTML}
          ${footerHTML}
          ${sponsorHTML}
        </div>
      `;
    }

    // ================================================================
    // 11. HELPERS
    // ================================================================
    function getDateInfo(dateStr) {
      const d = new Date(dateStr);
      const days = ['DOMINGO','LUNES','MARTES','MIÉRCOLES','JUEVES','VIERNES','SÁBADO'];
      return { dayName: days[d.getDay()], formatted: `${d.getDate()}/${d.getMonth()+1}` };
    }

    function buildTeamsHTML(mode, f, imgs, shieldSize) {
      // Para VS y RESULTADO ya se construye en el HTML directamente
      return '';
    }

    function buildAccesosHTML(f) {
      if (!f.accLocal && !f.accVisit) return '';
      return `
        <div class="flyer-accesos">
          ${f.accLocal ? `<div class="acceso-item"><span class="acceso-label">Acceso Local</span><span class="acceso-text">${f.accLocal}</span></div>` : ''}
          ${f.accVisit ? `<div class="acceso-item"><span class="acceso-label">Acceso Visitante</span><span class="acceso-text">${f.accVisit}</span></div>` : ''}
        </div>
      `;
    }

    function applyTransformations(card) {
      // Aplicar variables CSS de escala y posición
      const s = STATE.scales;
      const p = STATE.positions;
      const style = document.documentElement.style;
      style.setProperty('--scale-header', s.header/100);
      style.setProperty('--scale-catsub', s.catsub/100);
      style.setProperty('--scale-title', s.title/100);
      style.setProperty('--scale-info', s.info/100);
      style.setProperty('--scale-teams', s.teams/100);
      style.setProperty('--scale-accesos', s.accesos/100);
      style.setProperty('--scale-footer', s.footer/100);
      style.setProperty('--scale-sponsor', s.sponsor/100);
      style.setProperty('--scale-gentexto', s.gentexto/100);
      style.setProperty('--scale-genblock', s.genblock/100);
      style.setProperty('--pos-x-header', p.header.x+'px');
      style.setProperty('--pos-y-header', p.header.y+'px');
      style.setProperty('--pos-x-catsub', p.catsub.x+'px');
      style.setProperty('--pos-y-catsub', p.catsub.y+'px');
      style.setProperty('--pos-x-title', p.title.x+'px');
      style.setProperty('--pos-y-title', p.title.y+'px');
      style.setProperty('--pos-x-info', p.info.x+'px');
      style.setProperty('--pos-y-info', p.info.y+'px');
      style.setProperty('--pos-x-teams', p.teams.x+'px');
      style.setProperty('--pos-y-teams', p.teams.y+'px');
      style.setProperty('--pos-x-accesos', p.accesos.x+'px');
      style.setProperty('--pos-y-accesos', p.accesos.y+'px');
      style.setProperty('--pos-x-footer', p.footer.x+'px');
      style.setProperty('--pos-y-footer', p.footer.y+'px');
      style.setProperty('--pos-x-sponsor', p.sponsor.x+'px');
      style.setProperty('--pos-y-sponsor', p.sponsor.y+'px');
      style.setProperty('--pos-x-gentexto', p.gentexto.x+'px');
      style.setProperty('--pos-y-gentexto', p.gentexto.y+'px');
      style.setProperty('--pos-x-genblock', p.genblock.x+'px');
      style.setProperty('--pos-y-genblock', p.genblock.y+'px');
    }

    function scalePreview() {
      const frame = document.querySelector('.canvas-frame');
      const scaler = document.getElementById('preview-scaler');
      if (!frame || !scaler) return;
      const s = frame.clientWidth / 1080;
      scaler.style.transform = `scale(${s})`;
      scaler.style.width = '1080px';
      scaler.style.height = '1920px';
    }

    // ================================================================
    // 12. FOTO STATE (inicialización)
    // ================================================================
    function initFotoState() {
      const n = STATE.foto.natural;
      if (!n.w || !n.h) return;
      const canvas = { w:1080, h:1920 };
      const minScale = Math.max(canvas.w / n.w, canvas.h / n.h);
      const scale = minScale;
      const w = n.w * scale;
      const h = n.h * scale;
      STATE.foto.state916 = {
        fitMode: 'cover',
        scale, minScale, maxScale: minScale * 4,
        w, h,
        left: (canvas.w - w) / 2,
        top: (canvas.h - h) / 2
      };
      STATE.foto.state11 = JSON.parse(JSON.stringify(STATE.foto.state916));
      // Ajustar para 1:1
      const canvas11 = { w:1080, h:1080 };
      const minScale11 = Math.max(canvas11.w / n.w, canvas11.h / n.h);
      const scale11 = minScale11;
      STATE.foto.state11.scale = scale11;
      STATE.foto.state11.minScale = minScale11;
      STATE.foto.state11.maxScale = minScale11 * 4;
      STATE.foto.state11.w = n.w * scale11;
      STATE.foto.state11.h = n.h * scale11;
      STATE.foto.state11.left = (canvas11.w - STATE.foto.state11.w) / 2;
      STATE.foto.state11.top = (canvas11.h - STATE.foto.state11.h) / 2;
    }

    // ================================================================
    // 13. EXPORTACIÓN (mejorada)
    // ================================================================
    function exportFlyer() {
      const card = document.getElementById('preview-card');
      if (!card) return;
      showToast('Generando imagen...');
      // Forzar reflow
      void card.offsetHeight;
      html2canvas(card, {
        backgroundColor: '#0B132B',
        scale: 2,
        useCORS: true,
        allowTaint: true,
        logging: false,
        width: 1080,
        height: 1920
      }).then(canvas => {
        canvas.toBlob(blob => {
          if (!blob) { showToast('Error al generar'); return; }
          const filename = 'flyer-ceramica.jpg';
          // Intentar compartir o descargar
          if (navigator.share && navigator.canShare) {
            const file = new File([blob], filename, { type: 'image/jpeg' });
            if (navigator.canShare({ files: [file] })) {
              navigator.share({ files: [file] }).catch(() => {});
              return;
            }
          }
          // Descarga directa
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(() => URL.revokeObjectURL(url), 60000);
          showToast('Imagen descargada');
        }, 'image/jpeg', 0.95);
      }).catch(() => showToast('Error al exportar'));
    }

    // ================================================================
    // 14. NAVEGACIÓN PASOS
    // ================================================================
    document.getElementById('step-prev').addEventListener('click', () => {
      if (currentStep > 1) { currentStep--; renderStep(currentStep); }
    });
    document.getElementById('step-next').addEventListener('click', () => {
      if (currentStep < totalSteps) {
        currentStep++;
        renderStep(currentStep);
      } else {
        // Finalizar: cerrar editor
        closeEditor();
        showToast('Flyer listo!');
      }
    });

    document.getElementById('editor-back').addEventListener('click', () => {
      if (confirm('¿Salir sin guardar?')) closeEditor();
    });

    // ================================================================
    // 15. TEMA OSCURO/CLARO
    // ================================================================
    const themeToggle = document.getElementById('theme-toggle');
    const root = document.documentElement;
    const THEME_KEY = 'cera-flyers-theme';
    try {
      const saved = localStorage.getItem(THEME_KEY);
      if (saved) root.setAttribute('data-theme', saved);
    } catch(e) {}
    themeToggle.addEventListener('click', () => {
      const current = root.getAttribute('data-theme');
      const isDark = current === 'dark' || (!current && window.matchMedia('(prefers-color-scheme: dark)').matches);
      const next = isDark ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      try { localStorage.setItem(THEME_KEY, next); } catch(e) {}
    });

    // ================================================================
    // 16. PERSISTENCIA (localStorage)
    // ================================================================
    function saveState() {
      try {
        localStorage.setItem('flyerState', JSON.stringify(STATE));
      } catch(e) {}
    }

    function restoreState() {
      try {
        const raw = localStorage.getItem('flyerState');
        if (!raw) return false;
        const saved = JSON.parse(raw);
        // Restaurar solo si la plantilla existe
        if (!TEMPLATES.find(t => t.id === saved.template)) return false;
        Object.assign(STATE, saved);
        return true;
      } catch(e) { return false; }
    }

    // ================================================================
    // 17. INICIALIZACIÓN
    // ================================================================
    function init() {
      // Mostrar galería
      renderGallery();

      // Si hay estado guardado, ofrecer continuar
      if (restoreState() && STATE.template) {
        if (confirm('¿Continuar editando el flyer anterior?')) {
          // Abrir editor con la plantilla guardada
          const template = TEMPLATES.find(t => t.id === STATE.template);
          if (template) {
            openEditor(template.id, template.mode);
            // Restaurar campos en los pasos (se renderizan los pasos con valores actuales)
            // Forzar render del paso actual
            renderStep(currentStep);
            updatePreview();
          }
        } else {
          localStorage.removeItem('flyerState');
        }
      }

      // Auto-guardado cada 5 segundos
      setInterval(saveState, 5000);
    }

    // Esperar a que carguen las fuentes
    document.fonts.ready.then(() => {
      init();
      // Ajustar preview inicial
      setTimeout(scalePreview, 100);
    });

    // Re-escalar al cambiar tamaño de ventana
    window.addEventListener('resize', scalePreview);
  </script>
</body>
</html>
